[package]
name = "blu_dev"
version = "0.1.0"
edition = "2021"

[dependencies]
btleplug = "0.11"
eframe = "0.24"
egui = "0.24"
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
futures-util = "0.3"
uuid = { version = "1.6", features = ["v4"] }
winreg = "0.52"
anyhow = "1.0"
tray-icon = "0.12"
image = "0.24"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef", "winbase"] }
